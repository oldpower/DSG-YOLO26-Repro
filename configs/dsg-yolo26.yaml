# DSG-YOLO26 clean-room architecture reconstruction (Ultralytics 8.4)
# Publicly confirmed: YOLO26s baseline, DPSE on P2, P3 -> P2 SGCF, training-only SSR.
# Assumption: retain the YOLO26-P2 topology with P2/P3/P4/P5 detection outputs.
# The authors have not released exact layer parameters or module formulas.

nc: 80
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]  # paper baseline
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone: P1/2 through P5/32.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: shallow P2 details
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: backbone P3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6: backbone P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # Top-down P4 and P3 paths from YOLO26-P2.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, True]] # 13: top-down P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16: top-down P3 semantics

  # Publicly described DSG intervention: filter P3 semantics before P2, then DPSE.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17: upsampled P3 semantics
  - [[-1, 2], 1, SGCF, [128, 4]] # 18: P3/P2 scale-gated fusion
  - [-1, 2, DPSE, [128]] # 19: detail-preserving shallow enhancement (P2 output)

  # Bottom-up PAN path. The native YOLO26 Detect head is unchanged; SSR is
  # training-only and therefore intentionally absent from this inference graph.
  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [256, True]] # 22: P3 output
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [512, True]] # 25: P4 output
  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28: P5 output

  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29: Detect(P2, P3, P4, P5)
